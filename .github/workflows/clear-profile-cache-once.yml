name: Clear Obsolete Profile Actions Caches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/clear-profile-cache-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge this repository's Actions caches only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Before cache cleanup:'
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 || true
          gh cache delete --repo "$GITHUB_REPOSITORY" --all --succeed-on-no-caches
          echo 'After cache cleanup:'
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100
