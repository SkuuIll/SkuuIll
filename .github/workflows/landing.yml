name: Landing Quality

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.js'
      - '.github/workflows/landing.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.js'
      - '.github/workflows/landing.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: landing-test-results
          path: test-results/
          retention-days: 7
