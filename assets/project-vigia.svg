<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title"><title id="title">Vigía — Hotel operations, GPS and workforce</title><style>@keyframes glow{0%,100%{opacity:.25}50%{opacity:.38}} @keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}} .ambience{animation:glow 2s ease-in-out 2} text{animation:enter .8s ease-out both} @media(prefers-reduced-motion:reduce){.ambience,text{animation:none}}</style><defs><linearGradient id="color" x2="1" y2="1"><stop stop-color="#a375ff"/><stop offset=".5" stop-color="#36d8e8"/><stop offset="1" stop-color="#c7f284"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#c7f284" stroke-opacity=".055"/></pattern></defs><rect width="1200" height="190" rx="20" fill="#101713"/><rect x="1" y="1" width="1198" height="188" rx="19" fill="url(#grid)" stroke="#344139"/><rect class="ambience" x="1" y="1" width="1198" height="188" rx="19" fill="url(#color)" opacity=".25"/><text x="38" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="500" fill="#c7f284" >HOSPITALITY / SECURITY / WORKFORCE</text><text x="36" y="106" font-family="DejaVu Sans,Arial,sans-serif" font-size="48" font-weight="700" fill="#f2f4eb" >Vigía</text><text x="39" y="154" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#b7c4b8" >WEB / ANDROID / GPS / LINUX</text><path d="M760 130L840 60L935 100L1035 43L1145 95" fill="none" stroke="#5ee7ed" stroke-width="3" stroke-dasharray="6 6"/><circle cx="760" cy="130" r="7" fill="#c7f284"/><circle cx="840" cy="60" r="7" fill="#c7f284"/><circle cx="935" cy="100" r="7" fill="#c7f284"/><circle cx="1035" cy="43" r="7" fill="#c7f284"/><circle cx="1145" cy="95" r="7" fill="#c7f284"/></svg>